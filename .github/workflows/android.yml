name: Android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Test and build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest ships the Android SDK at $ANDROID_HOME; AGP downloads any
      # missing platform/build-tools itself (licences are pre-accepted there).
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      # Sign with the fixed keystore from secrets so each APK installs over the
      # previous one. Without the secrets (e.g. fork PRs) the build still runs,
      # signed with a throwaway debug key.
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; this APK is signed with a throwaway debug key and will not install over earlier builds."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
      - name: Assemble debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: quick-todo-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Google Play takes a release bundle signed with the upload key, so this
      # only runs when the keystore secrets are present.
      - name: Bundle release AAB
        if: env.ANDROID_KEYSTORE_PATH != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_PATH != ''
        with:
          name: quick-todo-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.jks"

  # Every merge into main ships the signed bundle to Google Play. The track
  # (default: internal) and release status (default: completed) can be changed
  # with the PLAY_TRACK and PLAY_RELEASE_STATUS repository variables.
  play:
    name: Publish to Google Play
    runs-on: ubuntu-latest
    needs: apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: play-publish
      cancel-in-progress: false
    steps:
      - name: Check for Play credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set, so this build cannot be published. See README → Publishing to Google Play."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: quick-todo-release.aab
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.clayson.todo
          releaseFiles: app-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
