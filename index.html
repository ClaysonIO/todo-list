<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)" />
    <title>Quick Todo</title>
    <script>
      // Runs before any CSS is applied so the first frame is already the right
      // theme: no light flash in dark mode and vice versa.
      try {
        var t = localStorage.getItem('quicktodo.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <main id="page-todo" class="page">
        <form id="add-form" class="add" autocomplete="off">
          <input
            id="add-input"
            type="text"
            placeholder="Add a todo and press Enter"
            aria-label="New todo"
            autocapitalize="sentences"
            autocomplete="off"
            maxlength="500"
          />
        </form>
        <ul id="list" class="list" aria-label="Todo list"></ul>
        <p id="empty" class="empty" hidden>Nothing to do. Type above to add something.</p>
      </main>
      <main id="page-expired" class="page" hidden></main>
      <main id="page-settings" class="page" hidden></main>
      <nav class="nav" aria-label="Pages">
        <a href="#/" data-route="todo" class="active">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>Todo</span>
        </a>
        <a href="#/expired" data-route="expired">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Expired</span>
        </a>
        <a href="#/settings" data-route="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Settings</span>
        </a>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
